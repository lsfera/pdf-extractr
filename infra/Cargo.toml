[package]
name = "pdf-extract-infra"
version = "0.1.0"
edition = "2024"

[dependencies]
# The Pulumi Rust SDK. While this is experimental and unpublished, point it
# at a local checkout; once published, use a version requirement instead.
pulumi = { path = "../../pulumi-rust/sdk/rust/pulumi" }
pulumi_aws = { path = "./sdks/aws/rust" }

[workspace]
exclude = ["sdks"]

[profile.dev]
debug = 0
incremental = false
