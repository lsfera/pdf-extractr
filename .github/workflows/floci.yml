name: floci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The unpublished pulumi-rust goes beside this repository, where the Docker build context (the parent of
  # pdf-extractor/) and infra/Cargo.toml expect it (../../pulumi-rust).
  PULUMI_RUST_REF: d62e9f213321befce6f870971e191c9f3946b967

jobs:
  floci:
    # arm64 so the Lambda (provided.al2023, arm64) runs natively inside Floci instead of under emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: pdf-extractor
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pulumi-labs/pulumi-rust
          ref: ${{ env.PULUMI_RUST_REF }}
          path: pulumi-rust
          persist-credentials: false

      # Same stack as `make test` (Pulumi, the Rust plugin, the generated AWS SDK and Floci all live in
      # compose.test.yml / Dockerfile.test). Only the image layers are cached here, since a fresh runner has none.
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: buildx-${{ runner.os }}-
      - name: build the test image
        working-directory: pdf-extractor
        run: |
          docker buildx bake -f compose.test.yml --load \
            --set "*.cache-from=type=local,src=$RUNNER_TEMP/buildx-cache" \
            --set "*.cache-to=type=local,dest=$RUNNER_TEMP/buildx-cache-new,mode=max" \
            tests
          # Replace the cache instead of appending to it, or it grows on every run.
          rm -rf "$RUNNER_TEMP/buildx-cache"
          mv "$RUNNER_TEMP/buildx-cache-new" "$RUNNER_TEMP/buildx-cache"

      - name: lambda tests and end-to-end test
        working-directory: pdf-extractor
        run: |
          trap 'docker compose -f compose.test.yml down -v --remove-orphans' EXIT
          docker compose -f compose.test.yml up --abort-on-container-exit --exit-code-from tests
